name: OneDrive 14-day summary

# Beijing Sat 06:00 == UTC Fri 22:00. Cron has no "every 2 weeks", so we fire
# every Friday 22:00 UTC and gate to even ISO weeks (~every 14 days).
on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch:
    inputs:
      summary_end_beijing:
        description: 'Optional fixed window end (YYYY-MM-DD HH:MM, Beijing)'
        required: false
        type: string

# Let the built-in GITHUB_TOKEN push the rotated rt.enc back to the repo
# (no personal access token needed).
permissions:
  contents: write

concurrency:
  # Shared with the finance-quarterly workflow so the two never run
  # simultaneously and clobber the shared rt.enc refresh token.
  group: onedrive-token
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Biweekly gate: run on even ISO weeks (Beijing time), or always when
      # triggered manually. Skips the rest of the job on odd weeks.
      - name: Biweekly gate
        id: gate
        run: |
          week=$(TZ=Asia/Shanghai date +%V)
          echo "Beijing ISO week: $week"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$week % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "-> running this week"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "-> odd week, skipping"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Auto-locate the automation folder anywhere in the repo, so the workflow
      # works regardless of where you committed it (root, spending-tracker/, ...).
      - name: Locate summarizer
        id: locate
        if: steps.gate.outputs.run == 'true'
        run: |
          script="$(find . -type f -name summarize.py -path '*automation*' | head -n1)"
          if [ -z "$script" ]; then
            echo "Could not find automation/summarize.py in the repo." >&2
            exit 1
          fi
          dir="$(dirname "$script")"
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "dir=$dir"        >> "$GITHUB_OUTPUT"
          echo "Found summarizer at: $script"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r "${{ steps.locate.outputs.dir }}/requirements.txt"

      - name: Run summarizer
        id: summarizer
        if: steps.gate.outputs.run == 'true'
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUMMARY_END_BEIJING: ${{ github.event.inputs.summary_end_beijing }}
          # Optional overrides:
          # SUMMARY_DAYS: "14"
          # CAL_NAME: "Celine-Nathan"   # calendar to read ("" disables it)
          # DEEPSEEK_MODEL: "deepseek-v4-pro"
          # LOG_PROMPT: "1"   # print the full prompt (blog+chat text) to the logs
        run: python "${{ steps.locate.outputs.script }}"

      - name: Commit rotated refresh token
        if: steps.gate.outputs.run == 'true'
        run: |
          rt="${{ steps.locate.outputs.dir }}/rt.enc"
          if ! git diff --quiet -- "$rt"; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$rt"
            git commit -m "chore: rotate OneDrive refresh token [skip ci]"
            git push
          else
            echo "rt.enc unchanged; nothing to commit."
          fi

      - name: Notify Enterprise WeChat
        if: always() && steps.summarizer.outcome == 'success'
        env:
          QY_WECHAT_API_KEY: ${{ secrets.QY_Wechat_API_Key }}
          RESULTS: 14days summary posted in a.cnmas.top
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CONTENT=$(printf '### GitHub Actions workflow completed\n> **Status:** Success\n> **Workflow:** %s\n> **Repository:** %s\n> **Completed:** %s\n\n**Results**\n%s\n\n[View workflow run](%s)' \
            "$WORKFLOW_NAME" "$REPOSITORY" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" "$RESULTS" "$RUN_URL")
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$CONTENT" '{msgtype:"markdown",markdown:{content:$content}}')" \
            "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${QY_WECHAT_API_KEY}")
          if [ "$(jq -r '.errcode // -1' <<< "$RESPONSE")" != "0" ]; then
            echo "::error::Enterprise WeChat notification failed: $RESPONSE"
            exit 1
          fi
