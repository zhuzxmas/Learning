# Quarterly stock fundamentals batch — personal-OneDrive edition.
# Runs finance_batch_personal.py, which stores everything on the user's personal
# OneDrive (Apps/StockBatchTracker/) via a delegated refresh token. Price history
# is read from pre-downloaded kline/{code}.txt files (the push2his kline API is
# not reachable from cloud IPs); reports/dividends are still fetched live from
# EastMoney's datacenter hosts.

name: finance-quarterly action

on:
  # 北京时间 = UTC+8，故 UTC 14:00 == 北京 22:00。
  #   · 每天（周二~周日，北京）22:00 跑轻量日更（价格+筹码，不抓财务）。
  #   · 每周一 22:00（北京）跑全量（抓财务+分红，刷新 pkl 缓存）。
  # cron 星期：UTC Mon(1) 14:00 == 北京周一 22:00；其余日为轻量。
  schedule:
    - cron: '0 14 * * 0,2-6'   # 轻量日更（北京 周日/周二~周六 晚，即周一以外）
    - cron: '0 14 * * 1'       # 全量（北京 周一 22:00）
  workflow_dispatch:
  repository_dispatch:
    types: [finance-batch-stock-event]

# Allow the rotated rt.enc to be committed back to the repo.
permissions:
  contents: write

# Share a single concurrency group with the OneDrive summarizer so the two
# workflows can never run at the same time and clobber the shared rt.enc.
concurrency:
  group: onedrive-token
  cancel-in-progress: false

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repo content
      uses: actions/checkout@v6

    - name: setup python 3.13.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-finance.txt ]; then pip install -r requirements-finance.txt; fi

    - name: run main file
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        # When triggered for a single stock via repository_dispatch
        # (finance-batch-stock-event), client_payload.stock limits the run to
        # that code. Empty on schedule/manual runs -> whole stock_list.csv.
        STOCK_ONLY: ${{ github.event.client_payload.stock }}
        # LIGHT_MODE=1 只在每天的轻量 cron（'0 14 * * 0,2-6'）触发时开启：
        # 只刷价格+筹码、财务走 pkl 缓存、不抓网络、短 sleep。
        # 周一全量 cron / workflow_dispatch / repository_dispatch 都是全量（LIGHT_MODE 空）。
        LIGHT_MODE: ${{ github.event.schedule == '0 14 * * 0,2-6' && '1' || '' }}
      run: python -u finance_batch_personal.py

    - name: Commit rotated refresh token
      run: |
        rt="a_cnmas_top/Family-tracker/automation/rt.enc"
        if ! git diff --quiet -- "$rt"; then
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$rt"
          git commit -m "chore: rotate OneDrive refresh token [skip ci]"
          # main may have advanced while the batch ran (other commits). Only
          # rt.enc is local and no other token-writer runs concurrently (see the
          # concurrency group), so rebase onto the latest main and retry.
          pushed=""
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed="yes"; break
            fi
            echo "push attempt $i failed; retrying after a short pause..."
            sleep $(( (RANDOM % 5) + 3 ))
          done
          if [ -z "$pushed" ]; then
            echo "::error::Could not push rotated rt.enc after 5 attempts."
            exit 1
          fi
        else
          echo "rt.enc unchanged; nothing to commit."
        fi
