name: send chip ranking mail

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the OneDrive concurrency group so it never overlaps a run that
# might rotate/replace the shared rt.enc.
concurrency:
  group: onedrive-token
  cancel-in-progress: false

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo content
      uses: actions/checkout@v6

    - name: setup python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-finance.txt

    - name: Send 筹码排行 email
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        STOCK_MAIL_SMTP_PASSWORD: ${{ secrets.STOCK_MAIL_SMTP_PASSWORD }}
        STOCK_MAIL_FROM: ${{ secrets.STOCK_MAIL_FROM }}
        STOCK_MAIL_FROM_NAME: ${{ vars.STOCK_MAIL_FROM_NAME }}
        STOCK_MAIL_TO: ${{ secrets.STOCK_MAIL_TO }}
      run: python -u send_chip_ranking_mail.py
