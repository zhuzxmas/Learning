name: stock detail mail

on:
  repository_dispatch:
    types: [stock-detail-mail-event]

permissions:
  contents: read

concurrency:
  group: onedrive-token
  cancel-in-progress: false

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo content
      uses: actions/checkout@v6
    - name: setup python 3.13.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-finance.txt ]; then pip install -r requirements-finance.txt; fi
    - name: Send selected stock detail
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_RT_READONLY: '1'
        client_id: ${{ secrets.CLIENT_ID }}
        client_secret: ${{ secrets.CLIENT_SECRET }}
        tenant_id: ${{ secrets.TENANT_ID }}
        STOCK_MAIL_FROM: ${{ secrets.STOCK_MAIL_FROM }}
        STOCK_MAIL_TO: ${{ secrets.STOCK_MAIL_TO }}
        STOCK_DETAIL_CODE: ${{ github.event.client_payload.stock }}
      run: python -u send_stock_detail_mail.py
